---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: fleet-management-demo
  annotations:
    kargo.akuity.io/color: green
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: otel-app
    sources:
      direct: true
  targets:
    selectors:
    - matchLabels:
        env: dev
    updateStrategy:
      maxConcurrent: 20
  promotionTemplate:
    spec:
      steps:
      - task:
          name: promote

---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: staging
  namespace: fleet-management-demo
  annotations:
    kargo.akuity.io/color: yellow
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: otel-app
    sources:
      stages:
        - dev
  targets:
    updateStrategy:
      maxConcurrent: 20
    selectors:
    - matchLabels:
        env: staging
  promotionTemplate:
    spec:
      steps:
      - task:
          name: promote

