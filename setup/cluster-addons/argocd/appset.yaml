apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-addons
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  # Kargo sets the image as Helm parameters when promoting; don't revert them
  ignoreApplicationDifferences:
  - jsonPointers:
    - /spec/source/helm/parameters
  generators:
  - matrix:
      generators:
      # Clusters, one inventory file per cluster (named <env>.<geo>.<cloud>.<region>.<3-digit-id>)
      - git:
          repoURL: https://github.com/jessesuen/fleet-management-demo.git
          revision: HEAD
          files:
          - path: inventory/clusters/*.yaml
      # Add-ons, one chart per add-on under charts/. Prefixed so its path params (.chart.path.*)
      # don't collide with the inventory generator's.
      - git:
          repoURL: https://github.com/jessesuen/fleet-management-demo.git
          revision: HEAD
          pathParamPrefix: chart
          directories:
          - path: charts/*
  template:
    metadata:
      name: '{{ .cluster }}.{{ .chart.path.basename }}'
      labels:
        appset: cluster-addons
        addon: '{{ .chart.path.basename }}'
        env: '{{ index (splitList "." .cluster) 0 }}'
        geo: '{{ index (splitList "." .cluster) 1 }}'
        cloud: '{{ index (splitList "." .cluster) 2 }}'
        region: '{{ index (splitList "." .cluster) 3 }}'
      annotations:
        # tst clusters all belong to the single test Stage; the others to <env>.<geo>
        kargo.akuity.io/authorized-stage: 'cluster-addons:{{ if hasPrefix "tst." .cluster }}test{{ else }}{{ index (splitList "." .cluster) 0 }}.{{ index (splitList "." .cluster) 1 }}{{ end }}'
    spec:
      project: cluster-addons
      source:
        repoURL: https://github.com/jessesuen/fleet-management-demo.git
        path: '{{ .chart.path.path }}'
        targetRevision: HEAD
        helm:
          valuesObject:
            name: '{{ .cluster }}.{{ .chart.path.basename }}'
            labels:
              addon: '{{ .chart.path.basename }}'
            config:
              CLUSTER: '{{ .cluster }}'
              ADDON: '{{ .chart.path.basename }}'
              ENV: '{{ index (splitList "." .cluster) 0 }}'
              GEO: '{{ index (splitList "." .cluster) 1 }}'
              CLOUD: '{{ index (splitList "." .cluster) 2 }}'
              REGION: '{{ index (splitList "." .cluster) 3 }}'
      destination:
        name: demo
        namespace: cluster-addons
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
