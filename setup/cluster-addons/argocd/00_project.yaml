apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cluster-addons
  namespace: argocd
spec:
  description: Cluster add-ons, generated by the cluster-addons ApplicationSet
  # Only the cluster-addon chart from this repo
  sourceRepos:
  - https://github.com/jessesuen/fleet-management-demo.git
  # Only the cluster-addons namespace of the demo cluster
  destinations:
  - name: demo
    namespace: cluster-addons
  # Namespaced resources, plus the cluster-addons Namespace itself. No other cluster-scoped
  # resources.
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
    name: cluster-addons
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
