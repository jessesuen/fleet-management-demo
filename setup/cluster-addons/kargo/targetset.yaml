apiVersion: ee.kargo.akuity.io/v1alpha1
kind: TargetSet
metadata:
  name: cluster-addons
  namespace: cluster-addons
spec:
  # One target per cluster, from the same inventory as the ApplicationSet
  generator:
    git:
      repoURL: https://github.com/jessesuen/fleet-management-demo.git
      ref: main
      files:
      - path: inventory/clusters/*.yaml
  template:
    metadata:
      name: '${{resource.cluster}}'
      labels:
        env: '${{split(resource.cluster, ".")[0]}}'
        geo: '${{split(resource.cluster, ".")[1]}}'
        cloud: '${{split(resource.cluster, ".")[2]}}'
        region: '${{split(resource.cluster, ".")[3]}}'
    spec:
      params:
        cluster: '${{resource.cluster}}'
        env: '${{split(resource.cluster, ".")[0]}}'
        geo: '${{split(resource.cluster, ".")[1]}}'
        cloud: '${{split(resource.cluster, ".")[2]}}'
        region: '${{split(resource.cluster, ".")[3]}}'