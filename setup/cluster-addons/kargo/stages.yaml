---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: tst.na
  namespace: cluster-addons
  annotations:
    kargo.akuity.io/color: green
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: external-dns
    sources:
      direct: true
  - origin:
      kind: Warehouse
      name: coredns
    sources:
      direct: true
  - origin:
      kind: Warehouse
      name: cert-manager
    sources:
      direct: true
  - origin:
      kind: Warehouse
      name: kyverno
    sources:
      direct: true
  - origin:
      kind: Warehouse
      name: traefik
    sources:
      direct: true
  targets:
    selectors:
    - matchLabels:
        env: tst
        geo: na
    updateStrategy:
      maxConcurrent: 5
  promotionTemplate:
    spec:
      steps:
      - task:
          name: promote
