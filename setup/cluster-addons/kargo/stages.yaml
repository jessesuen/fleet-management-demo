apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: cluster-addons
  annotations:
    kargo.akuity.io/color: orange
# Control-flow Stage: no targets or promotion steps. Freight becomes available here once it's been
# verified in every stg.<geo> Stage, and all prd.<geo> Stages take their Freight from here.
spec:
  requestedFreight:
  - origin: { kind: Warehouse, name: external-dns }
    sources: {stages: [stg.na, stg.latam, stg.eu, stg.apac, stg.gov], availabilityStrategy: All}
  - origin: { kind: Warehouse, name: coredns }
    sources: {stages: [stg.na, stg.latam, stg.eu, stg.apac, stg.gov], availabilityStrategy: All}
  - origin: { kind: Warehouse, name: cert-manager }
    sources: {stages: [stg.na, stg.latam, stg.eu, stg.apac, stg.gov], availabilityStrategy: All}
  - origin: { kind: Warehouse, name: kyverno }
    sources: {stages: [stg.na, stg.latam, stg.eu, stg.apac, stg.gov], availabilityStrategy: All}
  - origin: { kind: Warehouse, name: traefik }
    sources: {stages: [stg.na, stg.latam, stg.eu, stg.apac, stg.gov], availabilityStrategy: All}
  - origin: { kind: Warehouse, name: prometheus }
    sources: {stages: [stg.na, stg.latam, stg.eu, stg.apac, stg.gov], availabilityStrategy: All}
---
