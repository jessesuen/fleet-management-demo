# Image repository of each add-on, read by the promote PromotionTask. Keep in sync with the
# Warehouse subscriptions below.
apiVersion: v1
kind: ConfigMap
metadata:
  name: addon-images
  namespace: cluster-addons
data:
  external-dns: registry.k8s.io/external-dns/external-dns
  coredns: registry.k8s.io/coredns/coredns
  cert-manager: quay.io/jetstack/cert-manager-controller
  kyverno: ghcr.io/kyverno/kyverno
  traefik: docker.io/library/traefik
  prometheus: quay.io/prometheus/prometheus

---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: external-dns
  namespace: cluster-addons
spec:
  subscriptions:
  - image:
      repoURL: registry.k8s.io/external-dns/external-dns
      imageSelectionStrategy: SemVer
      # Releases only
      allowTagsRegexes:
      - ^v\d+\.\d+\.\d+$
      discoveryLimit: 10

---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: coredns
  namespace: cluster-addons
spec:
  subscriptions:
  - image:
      repoURL: registry.k8s.io/coredns/coredns
      imageSelectionStrategy: SemVer
      # Releases only
      allowTagsRegexes:
      - ^v\d+\.\d+\.\d+$
      discoveryLimit: 10

---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: cert-manager
  namespace: cluster-addons
spec:
  subscriptions:
  - image:
      repoURL: quay.io/jetstack/cert-manager-controller
      imageSelectionStrategy: SemVer
      # Releases only, no pre-releases (v1.21.0-alpha.0, v1.21.0-beta.0)
      allowTagsRegexes:
      - ^v\d+\.\d+\.\d+$
      discoveryLimit: 10

---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: kyverno
  namespace: cluster-addons
spec:
  subscriptions:
  - image:
      repoURL: ghcr.io/kyverno/kyverno
      imageSelectionStrategy: SemVer
      # Releases only, no release candidates (v1.19.2-rc.5)
      allowTagsRegexes:
      - ^v\d+\.\d+\.\d+$
      discoveryLimit: 10

---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: traefik
  namespace: cluster-addons
spec:
  subscriptions:
  - image:
      repoURL: docker.io/library/traefik
      imageSelectionStrategy: SemVer
      # Releases only: no Windows variants (v3.7.16-nanoserver-ltsc2022), and only the v-prefixed
      # tags, since each release is also tagged without the v
      allowTagsRegexes:
      - ^v\d+\.\d+\.\d+$
      discoveryLimit: 10

---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: prometheus
  namespace: cluster-addons
spec:
  subscriptions:
  - image:
      repoURL: quay.io/prometheus/prometheus
      imageSelectionStrategy: SemVer
      # Releases only: no release candidates (v3.15.0-rc.1) or image variants (v3.15.0-busybox,
      # v3.15.0-distroless)
      allowTagsRegexes:
      - ^v\d+\.\d+\.\d+$
      discoveryLimit: 10
