apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: promote
  namespace: cluster-addons
spec:
  vars:
  # The add-on being promoted is the Warehouse the Freight came from
  - name: addon
    value: ${{ ctx.targetFreight.origin.name }}
  - name: imageRepo
    value: ${{ configMap("addon-images")[ctx.targetFreight.origin.name] }}
  steps:
  # Simulated failure, for clusters with fail: "true" in their inventory file. Each Stage tolerates
  # some failed targets (maxFailures), so the promotion as a whole still succeeds.
  - uses: fail
    if: ${{ string(target.params.fail) == "true" }}
    config:
      message: Simulated failure on ${{ target.name }} (fail is "true" in its inventory file)
  - uses: argocd-update
    config:
      apps:
      # The ApplicationSet names each Application <cluster>.<addon>
      - name: ${{ target.name }}.${{ vars.addon }}
        sources:
        - repoURL: https://github.com/jessesuen/fleet-management-demo.git
          helm:
            images:
            - key: image.repository
              value: ${{ vars.imageRepo }}
            - key: image.tag
              value: ${{ imageFrom(vars.imageRepo, warehouse(vars.addon)).Tag }}
